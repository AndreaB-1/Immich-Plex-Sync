services:
  immich-to-plex:
    image: ghcr.io/andreab-1/immich-plex-sync:latest
    build: .
    container_name: immich-to-plex
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8585}:${WEB_PORT:-8585}"
    volumes:
      # Mount the same photo library that Immich uses (read-only).
      # The path on the LEFT must match the path Immich stores files under
      # so that symlinks resolve correctly inside this container.
      - /home/docker/Immich_Lib:/photos:ro
      # Output dir where album symlink folders will be created.
      # Point your Plex photo library at the HOST path on the left.
      - /home/docker/Immich_Plex_Sync:/output
    environment:
      - IMMICH_URL=${IMMICH_URL:-http://192.168.1.111:2283}
      - IMMICH_API_KEY=${IMMICH_API_KEY}
      - OUTPUT_DIR=${OUTPUT_DIR:-/output}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-0 2 * * *}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WEB_PORT=${WEB_PORT:-8585}
